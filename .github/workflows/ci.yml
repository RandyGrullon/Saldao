# En cada subida a main y en cada pull request: tipos, pruebas (reglas de dinero, migraciones en Postgres, tipos de la
# base al día, núcleo sin navegador, la cola sin conexión), que la web compile y que la app nativa arme su paquete de
# Android con Metro. Vercel publica la web aparte; esto avisa si algo se rompió.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probar:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npm run typecheck -w @saldao/mobile
      - name: Paquete de Android (Metro)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir ${{ runner.temp }}/saldao-android
