<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f3f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f7;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:20px;font-family:Sora,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#1b1d1f;">
        <tr><td style="padding:32px 28px 8px;">
          <img src="https://saldao-green.vercel.app/pwa-64x64.png" width="48" height="48" alt="Saldao" style="display:block;border-radius:12px;">
        </td></tr>
        <tr><td style="padding:16px 28px 0;">
          <h1 style="margin:0;font-size:24px;line-height:1.25;font-weight:700;">Crea una contraseña nueva</h1>
          <p style="margin:12px 0 0;font-size:16px;line-height:1.5;color:#5c6064;">Pediste cambiar la contraseña de tu cuenta de Saldao. Toca el botón y elige una nueva.</p>
        </td></tr>
        <tr><td style="padding:24px 28px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c8f169;color:#0e0f13;text-decoration:none;font-size:16px;font-weight:700;padding:14px 24px;border-radius:12px;">Crear contraseña nueva</a>
        </td></tr>
        <tr><td style="padding:0 28px 32px;font-size:14px;line-height:1.5;color:#6f7378;">
          <p style="margin:0;">Si el botón no abre, copia este enlace en el navegador:</p>
          <p style="margin:4px 0 16px;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#4d7c0f;">{{ .ConfirmationURL }}</a></p>
          <p style="margin:0;">Si no lo pediste tú, ignora este correo: tu contraseña sigue igual.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
